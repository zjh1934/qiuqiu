apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    // 不写 buildToolsVersion，让 AGP 用自带的默认版本，避免"没装这个版本"报错

    defaultConfig {
        applicationId "com.floating.combo"
        minSdkVersion 24
        targetSdkVersion 29
        versionCode 8
        versionName "2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
